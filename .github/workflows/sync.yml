name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_latest_release_from_upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Latest Stable Tag
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              // 1. Backup user's wrangler.json (D1 database config)
              const wranglerPath = '_workers_next/wrangler.json';
              let userWrangler = null;
              
              if (fs.existsSync(wranglerPath)) {
                const content = fs.readFileSync(wranglerPath, 'utf8');
                if (content.includes('d1_databases')) {
                  userWrangler = content;
                  console.log('📦 Backed up user wrangler.json with D1 config');
                }
              }
              
              // 2. Configure Git
              await exec.exec('git', ['config', '--global', 'user.name', 'GitHub Actions']);
              await exec.exec('git', ['config', '--global', 'user.email', 'actions@github.com']);
              
              // 3. Add Upstream and fetch tags
              try {
                await exec.exec('git', ['remote', 'add', 'upstream', 'https://github.com/chatgptuk/ldc-shop.git']);
              } catch (e) {
                await exec.exec('git', ['remote', 'set-url', 'upstream', 'https://github.com/chatgptuk/ldc-shop.git']);
              }
              await exec.exec('git', ['fetch', 'upstream', '--tags']);
              
              // 4. Find the latest stable semver tag (exclude beta, rc, alpha, test)
              let tagOutput = '';
              await exec.exec('git', ['tag', '-l', '--sort=-v:refname'], {
                listeners: {
                  stdout: (data) => { tagOutput += data.toString(); }
                }
              });
              
              const allTags = tagOutput.split('\n').map(t => t.trim()).filter(Boolean);
              const stableTag = allTags.find(tag => /^v?\d+\.\d+(\.\d+)?$/.test(tag) && !tag.includes('beta') && !tag.includes('rc') && !tag.includes('alpha'));
              
              if (!stableTag) {
                throw new Error('No valid stable release tag found in upstream!');
              }
              
              console.log(`🎯 Identified latest stable upstream tag: ${stableTag}`);
              
              // 5. Hard Reset to the latest stable tag
              await exec.exec('git', ['checkout', 'main']);
              await exec.exec('git', ['reset', '--hard', stableTag]);
              
              // 6. Restore user's custom wrangler.json
              if (userWrangler) {
                fs.writeFileSync(wranglerPath, userWrangler);
                await exec.exec('git', ['add', wranglerPath]);
                
                let hasChanges = false;
                try {
                  await exec.exec('git', ['diff', '--cached', '--quiet']);
                } catch (e) {
                  hasChanges = true;
                }
                
                if (hasChanges) {
                  await exec.exec('git', ['commit', '-m', `chore: preserve user wrangler.json config for ${stableTag}`]);
                  console.log(`✅ Restored user wrangler.json config for ${stableTag}`);
                }
              }
              
              // 7. Force Push to origin main
              await exec.exec('git', ['push', 'origin', 'main', '--force']);
              console.log(`🎉 Successfully synced origin/main to stable release ${stableTag}`);
            } catch (error) {
              core.setFailed(`Sync failed: ${error.message}`);
            }
